name: iOS CI

# The authoritative Apple build gate for this fork.
#
# The Linux harness (see `linux-tests` below) stays useful because it is fast
# and runs on every push, but it compiles Foundation-only sources. Only Xcode
# can tell us whether the app target, the extensions, the native sandbox and
# the MLX package actually build for a real iPad.

on:
  push:
    branches:
      - claude/pre-mac-ipad-ready
  workflow_dispatch:
    inputs:
      skip_native:
        description: "Skip the native dependency build (probe/lint only)"
        type: boolean
        default: false

concurrency:
  # Deliberately not cancel-in-progress: the native dependency build takes the
  # better part of an hour and a docs commit landing mid-run should not throw
  # that away.
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Cheap, fast feedback. Runs on every push and never blocks on the 40-minute
  # native build.
  # ---------------------------------------------------------------------------
  linux-tests:
    name: Linux unit tests + project validators
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: ~/swift-toolchain
          key: swift-6.0.3-ubuntu24.04

      - name: Install Swift 6.0.3
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/swift-toolchain
          url=https://download.swift.org/swift-6.0.3-release/ubuntu2404/swift-6.0.3-RELEASE/swift-6.0.3-RELEASE-ubuntu24.04.tar.gz
          curl -fsSL "$url" | tar xz -C ~/swift-toolchain --strip-components=1

      - name: Unit tests (Swift 6 strict concurrency)
        run: ./scripts/linux_test_harness.sh ~/swift-toolchain/usr/bin

      - name: ProviderType exhaustiveness
        run: python3 scripts/check_provider_type_exhaustive.py

      - name: Xcode project file is well-formed
        run: python3 scripts/validate_xcodeproj.py

      - name: Entitlement / capability audit
        run: python3 scripts/audit_entitlements.py

      - name: Features are reachable from running code
        run: python3 scripts/check_runtime_wiring.py

      - name: Local model catalog matches the linked MLX revision
        run: python3 scripts/check_local_models.py

      - name: mlx-swift-lm is linked into the app target
        run: python3 scripts/add_mlx_package.py --check

      - name: MCP integration test over a real socket
        run: ./scripts/integration_test_mcp.sh ~/swift-toolchain/usr/bin

  # ---------------------------------------------------------------------------
  # What the runner actually gives us. Deliberately its own job: it is two
  # minutes long and it is the first thing to read when a native step breaks.
  # ---------------------------------------------------------------------------
  probe:
    name: macOS runner probe
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain inventory
        run: |
          set -x
          sw_vers
          uname -m
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcrun --sdk iphoneos --show-sdk-path || true
          xcrun --sdk iphoneos --show-sdk-version || true
          swift --version
          python3 --version
          for t in ninja meson llvm-config pkg-config cmake zip; do
            printf '%-12s ' "$t"; command -v "$t" || echo "(absent)"
          done
          brew --version
          for f in ninja llvm libarchive pkg-config; do
            printf '%-12s ' "$f"; brew list --versions "$f" || echo "(not installed)"
          done
          df -h /
          sysctl -n hw.ncpu hw.memsize

      - name: Metal toolchain present?
        continue-on-error: true
        run: xcrun metal --version

      - name: Xcode sees the project
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig
          # plutil reads the same OpenStep grammar Xcode does; if this fails,
          # scripts/validate_xcodeproj.py should have caught it first.
          plutil -lint src/ios/Minis.xcodeproj/project.pbxproj
          xcodebuild -project src/ios/Minis.xcodeproj -list

      - name: Destinations available for the Minis scheme
        continue-on-error: true
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
                     -showdestinations 2>&1 | head -40

  # ---------------------------------------------------------------------------
  # The expensive part. Cached on the inputs that can change its output:
  # the build scripts themselves and the pinned submodule commits.
  # ---------------------------------------------------------------------------
  native-deps:
    name: Native dependencies (LAME, FFmpeg, iSH, Alpine)
    runs-on: macos-26
    if: ${{ !inputs.skip_native }}
    timeout-minutes: 90
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compute cache key
        id: key
        run: |
          set -euo pipefail
          # Everything that determines the contents of deps/{libs,include,frameworks,resources}.
          hash=$(cat deps/build_lame.sh deps/build_ffmpeg.sh deps/build_ish.sh \
                     deps/prepare_alpine_rootfs.sh \
                 | shasum -a 256 | cut -c1-16)
          ish=$(git -C deps/ish rev-parse HEAD)
          # `head -1` here would close the pipe while xcodebuild is still
          # writing, and xcodebuild raises NSFileHandleOperationException on
          # EPIPE rather than exiting quietly — with pipefail that fails the
          # step. sed reads its input to the end.
          xc=$(xcodebuild -version | sed -n '1p' | tr -d ' ')
          echo "key=native-${xc}-ish${ish:0:12}-scripts${hash}" >> "$GITHUB_OUTPUT"

      - name: Restore native build products
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: ${{ steps.key.outputs.key }}

      - name: Install build tools
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # The runner ships ninja, cmake, pkg-config and zip; the probe job
          # showed llvm, libarchive and meson are absent. llvm is needed to
          # compile the guest VDSO, libarchive to unpack the rootfs.
          #
          # lld is a separate formula from llvm in Homebrew, and the VDSO is
          # linked with `-fuse-ld=lld`; without it Homebrew's clang reports
          # "invalid linker name in argument '-fuse-ld=lld'" and the whole iSH
          # build stops, because the VDSO is a dependency of libish.
          brew install llvm libarchive lld
          brew list --versions ninja pkg-config
          python3 -m pip install --break-system-packages --upgrade meson
          meson --version
          echo "== linkers visible to clang =="
          ls /opt/homebrew/opt/llvm/bin | grep -i '^ld\|lld' || echo "(none in llvm/bin)"
          command -v ld.lld lld || true
          # `-fuse-ld=lld` resolves ld.lld from PATH; the lld formula links it
          # into /opt/homebrew/bin, which is already there. Verify rather than
          # assume, because the failure mode is a 4-second build error four
          # minutes into the job.
          ld.lld --version

      - name: Build LAME
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ./deps/build_lame.sh 2>&1 | tee "$RUNNER_TEMP/logs/build_lame.log"

      - name: Build FFmpeg
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ./deps/build_ffmpeg.sh 2>&1 | tee "$RUNNER_TEMP/logs/build_ffmpeg.log"

      - name: Build iSH
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ./deps/build_ish.sh 2>&1 | tee "$RUNNER_TEMP/logs/build_ish.log"

      - name: Prepare Alpine rootfs
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ./deps/prepare_alpine_rootfs.sh 2>&1 | tee "$RUNNER_TEMP/logs/prepare_alpine_rootfs.log"

      - name: Inventory what was produced
        if: always()
        run: |
          for d in deps/libs deps/include deps/frameworks deps/resources deps/lame-build; do
            echo "== $d =="
            ls -la "$d" 2>/dev/null || echo "(absent)"
          done

      - name: Upload native build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-deps-logs
          retention-days: 7
          if-no-files-found: ignore
          path: ${{ runner.temp }}/logs

      - name: Upload native products
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: native-deps
          retention-days: 3
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources

  # ---------------------------------------------------------------------------
  # The actual Apple gate: does this compile for a real iPad?
  # ---------------------------------------------------------------------------
  app-build:
    name: Build Minis for a physical iPad (unsigned)
    runs-on: macos-26
    needs: native-deps
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore native build products
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: ${{ needs.native-deps.outputs.cache-key }}

      - name: Build-time customization (empty values are supported)
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example \
             src/ios/Configs/ProviderCustomization.xcconfig

      - name: Metal toolchain
        run: |
          # mlx-swift compiles Metal kernels. Since Xcode 16.3 the Metal
          # toolchain is a separately downloadable component, so check rather
          # than assume; downloading it is a no-op when it is already present.
          if xcrun metal --version 2>/dev/null; then
            echo "Metal toolchain present"
          else
            echo "Metal toolchain absent — downloading"
            xcodebuild -downloadComponent MetalToolchain
            xcrun metal --version
          fi

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('src/ios/Minis.xcodeproj/project.pbxproj') }}
          restore-keys: spm-

      - name: Resolve Swift packages
        run: |
          # Two separate trust gates, and they need two separate flags.
          #
          # -skipMacroValidation: MLXHuggingFace ships a Swift macro
          # (#huggingFaceLoadModelContainer), and Xcode asks a human to trust a
          # macro the first time it sees one.
          #
          # -skipPackagePluginValidation: mlx-swift ships a build-tool plugin
          # called CudaBuild. Validation happens before the plugin would decide
          # it has nothing to do on iOS, so the build stops at
          # `Validate plug-in "CudaBuild" in package "mlx-swift"` without it.
          #
          # There is no human on a runner to click either prompt.
          xcodebuild -project src/ios/Minis.xcodeproj \
                     -scheme Minis \
                     -skipMacroValidation \
                     -skipPackagePluginValidation \
                     -resolvePackageDependencies

      - name: Build for generic iOS device (arm64, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj \
                     -scheme Minis \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath "$RUNNER_TEMP/dd" \
                     -skipMacroValidation \
                     -skipPackagePluginValidation \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY="" \
                     build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # After the build, not before: a dependency change is a policy question,
      # and finding out whether the app still compiles matters more than
      # answering it first.
      - name: Package graph matches the committed Package.resolved
        if: always()
        run: |
          set -euo pipefail
          f=src/ios/Minis.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          if [ ! -f "$f" ]; then echo "no Package.resolved produced"; exit 1; fi
          python3 - "$f" <<'PY'
          import json, subprocess, sys
          path = sys.argv[1]
          def pins(text):
              return {p["identity"]: (p["state"].get("version")
                                      or p["state"].get("revision", "")[:12])
                      for p in json.loads(text)["pins"]}
          now = pins(open(path).read())
          committed = pins(subprocess.run(
              ["git", "show", f"HEAD:{path}"], capture_output=True, text=True,
              check=True).stdout)
          for identity in sorted(set(now) | set(committed)):
              a, b = committed.get(identity), now.get(identity)
              flag = "  " if a == b else "->"
              print(f"{flag} {identity:<34} {a or '(new)'}"
                    + ("" if a == b else f"  now {b or '(removed)'}"))
          if now != committed:
              print("\n--- resolved file, to commit if this change is intended ---")
              print(open(path).read())
              print("Resolving changed the dependency graph. If that is "
                    "intended, commit the updated Package.resolved; the point of "
                    "committing it is that a bump is a decision, not a surprise.",
                    file=sys.stderr)
              sys.exit(1)
          print(f"\nOK  {len(now)} packages, unchanged")
          PY

      - name: Package unsigned IPAs
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/Minis.app"
          mkdir -p artifacts
          ./scripts/make_ipa.sh "$APP" "$PWD/artifacts/MiniPad-unsigned.ipa"
          ./scripts/make_ipa.sh "$APP" "$PWD/artifacts/MiniPad-PersonalFree-unsigned.ipa" \
                                --strip-extensions

      - name: Upload IPAs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          retention-days: 14
          if-no-files-found: ignore
          path: |
            artifacts/*.ipa
            artifacts/*.sha256

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          retention-days: 7
          path: ${{ runner.temp }}/xcodebuild.log
